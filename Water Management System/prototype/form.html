<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add New Concern | Water Management System</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- ============ TOP BAR ============ -->
<header class="topbar">
    <div class="brand">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.7s7 6.6 7 11.3a7 7 0 0 1-14 0c0-4.7 7-11.3 7-11.3z"/></svg>
        <span>Water Management System</span>
    </div>

    <div class="user-chip">
        <span class="avatar">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21v-1a6 6 0 0 1 6-6h4a6 6 0 0 1 6 6v1"/></svg>
        </span>
        <span>Admin</span>
    </div>
</header>

<div class="app">

    <!-- ============ SIDEBAR ============ -->
    <aside class="sidebar">
        <nav aria-label="Main navigation">
            <ul class="sidebar-menu">
                <li>
                    <a href="#">
                        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/><path d="M10 21v-6h4v6"/></svg>
                        Dashboard
                    </a>
                </li>
                <li>
                    <a href="#">
                        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20v-1a6 6 0 0 1 6-6h1a6 6 0 0 1 6 6v1"/><path d="M16 4.6a3.5 3.5 0 0 1 0 6.8"/><path d="M18.5 13.4a6 6 0 0 1 3 5.6v1"/></svg>
                        Residents
                    </a>
                </li>
                <li>
                    <a href="list.html" class="active" aria-current="page">
                        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg>
                        Service Concerns
                    </a>
                </li>
                <li>
                    <a href="#">
                        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="17" rx="2"/><circle cx="12" cy="11" r="2.5"/><path d="M7.5 18a4.5 4.5 0 0 1 9 0"/><path d="M9 2v3"/><path d="M15 2v3"/></svg>
                        Personnel
                    </a>
                </li>
                <li>
                    <a href="#">
                        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 3h6v3H9z"/><path d="M9 12h6"/><path d="M9 16h4"/></svg>
                        Assignments
                    </a>
                </li>
                <li>
                    <a href="#">
                        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4.5" width="18" height="16.5" rx="2"/><path d="M3 10h18"/><path d="M8 2.5v4"/><path d="M16 2.5v4"/></svg>
                        Water Schedule
                    </a>
                </li>
                <li>
                    <a href="#">
                        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 8.5 3 8.5H3S6 15 6 8"/><path d="M10.3 21a1.9 1.9 0 0 0 3.4 0"/></svg>
                        Notification
                    </a>
                </li>
            </ul>
        </nav>

        <div class="sidebar-footer">
            <a href="#">
                <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
                Logout
            </a>
        </div>
    </aside>

    <!-- ============ MAIN CONTENT ============ -->
    <main class="main">

        <section class="page-heading">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 8v8"/><path d="M8 12h8"/></svg>
            <h2>Add New Concern</h2>
        </section>

        <section class="content-card form-card">

            <div class="form-heading">
                <h3>Concern Information</h3>
            </div>

            <form action="#" method="post">

                <div class="form-group">
                    <label for="Resident_Name">Resident <span class="required">*</span></label>
                    <input
                         type="text"
                         id="Resident_Name"
                         name="Resident_Name"
                         list="resident-list"
                         placeholder="Type or select resident"
                         autocomplete="off"
                         required>

                    <datalist id="resident-list">
                        <option value="Andrea De Lima">
                        <option value="Jaz Diaz">
                        <option value="Wilma Briozo">
                        <option value="Rica Iliw-Iliw">
                        <option value="Aya Pendon">
                        <option value="Ruth Cada">
                    </datalist>
                </div>

                <div class="form-group">
                    <label for="Concern_Type">Concern Type <span class="required">*</span></label>
                    <select id="Concern_Type" name="Concern_Type" required>
                        <option value="">Select concern type</option>
                        <option value="Leak">Leak</option>
                        <option value="No Water">No Water</option>
                        <option value="Low Water">Low Water</option>
                        <option value="Billing">Billing</option>
                        <option value="Damaged Pipes">Damaged Pipes</option>
                        <option value="Water Quality">Water Quality</option>
                        <option value="Other">Other</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="Description">Description <span class="required">*</span></label>
                    <textarea id="Description" name="Description" rows="4" placeholder="Describe the reported concern..." required></textarea>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="Date_Reported">Date Reported <span class="required">*</span></label>
                        <input type="date" id="Date_Reported" name="Date_Reported" required>
                    </div>

                    <div class="form-group">
                        <label for="Personnel_ID">Assign Personnel <span class="required">*</span></label>
                        <select id="Personnel_ID" name="Personnel_ID" required>
                            <option value="">Select personnel</option>
                            <option value="1">Personnel 1</option>
                            <option value="2">Personnel 2</option>
                            <option value="3">Personnel 3</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="Priority">Priority <span class="required">*</span></label>
                        <select id="Priority" name="Priority" required>
                            <option value="">Select priority</option>
                            <option value="Low">Low</option>
                            <option value="Medium">Medium</option>
                            <option value="High">High</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label for="Status">Status <span class="required">*</span></label>
                    <select id="Status" name="Status" required>
                        <option value="">Select status</option>
                        <option value="Pending">Pending</option>
                        <option value="Assigned">Assigned</option>
                        <option value="In Progress">In Progress</option>
                        <option value="Resolved">Resolved</option>
                    </select>
                </div>

                <div class="form-actions">
                    <a href="list.html" class="button button-secondary">Cancel</a>
                    <button type="submit" class="button button-primary">Save Concern</button>
                </div>

            </form>
        </section>

    </main>
</div>

</body>
</html>
