<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Service Concern | Community Water Service</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="header">
    <div class="header-content">
        <a class="brand" href="list.html">
            <div class="logo">CWM</div>
            <div>
                <h1>Community Water Service</h1>
                <p>Concern Recording and Tracking System</p>
            </div>
        </a>

        <nav aria-label="Main navigation">
            <a href="list.html">Concerns</a>
            <a href="form.html" class="active">Add Concern</a>
            <a href="#">Schedules</a>
            <a href="#">Notifications</a>
        </nav>
    </div>
</header>

<main class="container">

    <section class="page-heading">
        <div>
            <p class="section-label">RECORD MANAGEMENT</p>
            <h2>Add Service Concern</h2>
        </div>

        <a href="list.html" class="button button-secondary">
            Back to List
        </a>
    </section>

    <section class="content-card form-card">

        <div class="form-heading">
            <h3>Concern Information</h3>
        </div>

        <form action="#" method="post">

            <div class="form-group">
                <label for="Resident_ID">
                    Resident <span class="required">*</span>
                </label>

                <select id="Resident_ID" name="Resident_ID" required>
                    <option value="">Select resident</option>
                    <option value="1">Andrea De Lima</option>
                    <option value="2">Jas Diaz</option>
                    <option value="3">Wilma Briozo</option>
                    <option value="4">Rica Iliw-Iliw</option>
                    <option value="5">Aya Pendon</option>
                </select>
            </div>

            <div class="form-group">
                <label for="Concern_Type">
                    Concern Type <span class="required">*</span>
                </label>

                <select id="Concern_Type" name="Concern_Type" required>
                    <option value="">Select concern type</option>
                    <option value="Low Pressure">Low Pressure</option>
                    <option value="Billing">Billing</option>
                    <option value="Damaged Pipes">Damaged Pipes</option>
                    <option value="Water Interruption">Water Interruption</option>
                    <option value="Water Quality">Water Quality</option>
                    <option value="Other">Other</option>
                </select>
            </div>

            <div class="form-group">
                <label for="Description">
                    Description <span class="required">*</span>
                </label>

                <textarea
                    id="Description"
                    name="Description"
                    rows="4"
                    placeholder="Describe the reported concern..."
                    required></textarea>
            </div>

            <div class="form-row">

                <div class="form-group">
                    <label for="Date_Reported">
                        Date Reported <span class="required">*</span>
                    </label>

                    <input
                        type="datetime-local"
                        id="Date_Reported"
                        name="Date_Reported"
                        required>
                </div>

                <div class="form-group">
                    <label for="Priority">
                        Priority <span class="required">*</span>
                    </label>

                    <select id="Priority" name="Priority" required>
                        <option value="">Select priority</option>
                        <option value="Low">Low</option>
                        <option value="Medium">Medium</option>
                        <option value="High">High</option>
                    </select>
                </div>

            </div>

            <div class="form-group">
                <label for="Status">
                    Status <span class="required">*</span>
                </label>

                <select id="Status" name="Status" required>
                    <option value="">Select status</option>
                    <option value="Pending">Pending</option>
                    <option value="Assigned">Assigned</option>
                    <option value="In Progress">In Progress</option>
                    <option value="Resolved">Resolved</option>
                </select>

            </div>

            <div class="form-actions">
                <a href="list.html" class="button button-secondary">
                    Cancel
                </a>

                <button type="submit" class="button button-primary">
                    Save Concern
                </button>
            </div>

        </form>
    </section>

</main>

<footer>
    <p>Community Water Service Concern Recording and Tracking System</p>
    <p>Ocampo, Camarines Sur</p>
</footer>

</body>
</html>
